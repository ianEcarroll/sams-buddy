# Render Blueprint: API only. Database: sams_buddy on the existing Postgres instance.
services:
  - type: web
    name: sams-buddy-api
    runtime: node
    plan: starter
    # Must match the Postgres instance's region (shown on the database page in Render)
    # so DATABASE_URL can use the internal URL. Region cannot be changed after creation.
    region: oregon
    rootDir: api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL        # internal URL of the existing instance, ending in /sams_buddy
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: PROXY_SECRET        # same value as the Worker secret
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: RESEND_API_KEY      # optional: practice emails to the team
        sync: false
      - key: EMAIL_FROM          # e.g. Buddy <buddy@yourdomain.com>, on a domain verified in Resend
        sync: false
      - key: APP_URL             # e.g. https://divine-bird-d627.ian-d13.workers.dev, for the link in emails
        sync: false
      - key: VAPID_PUBLIC_KEY    # practice reminders: make both with  npx web-push generate-vapid-keys
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT       # e.g. mailto:ian@pinpointed.dev
        sync: false
      - key: PLATFORM_ADMINS     # emails that see the Families tab (Buddy admin), comma separated
        sync: false
