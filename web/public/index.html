<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f7a6a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TALVO">
  <title>TALVO</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Practise talking with Foxy, a calm conversation coach.">
  <link rel="preload" href="/fonts/lexend-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Keep the launch overlay hidden until the video actually starts playing. -->
  <div id="launch" hidden style="position:fixed;inset:0;z-index:50;background:#abcbf9;display:grid;place-items:center;transition:opacity .4s">
    <video id="launch-video" playsinline preload="auto"><source src="/img/welcome.mp4" type="video/mp4"></video>
    <button id="launch-sound" class="launch-btn launch-sound" type="button" hidden>Tap for sound</button>
    <button id="launch-skip" class="launch-btn launch-skip" type="button" hidden>Skip</button>
  </div>
  <main id="app" class="sam" aria-live="polite"></main>
  <audio id="voice" preload="auto" playsinline></audio>
  <script type="module" src="/app.js"></script>
</body>
</html>
